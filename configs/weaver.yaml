# WEAVER: single-step training from random initialization
# LR scaled to the effective global batch (2 x 16 = 32).
seed_everything: 42

trainer:
  default_root_dir: outputs/weaver
  accelerator: gpu
  strategy: fsdp
  devices: 8
  num_nodes: 2
  precision: 16-mixed
  min_epochs: 1
  max_epochs: 150
  enable_progress_bar: true
  sync_batchnorm: True
  enable_checkpointing: True
  num_sanity_val_steps: 1
  fast_dev_run: false
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      name: weaver
      save_dir: "${trainer.default_root_dir}"
      project: weaver
  callbacks:
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: "${trainer.default_root_dir}/checkpoints"
        monitor: "val/w_mse_aggregate_24_hrs_ensemble_mean"
        mode: "min"
        save_top_k: 1
        save_last: True
        verbose: False
        filename: "epoch_{epoch:03d}"
        auto_insert_metric_name: False
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: "val/w_mse_aggregate_24_hrs_ensemble_mean"
        mode: "min"
        patience: 10
        min_delta: 0.
    - class_path: lightning.pytorch.callbacks.RichModelSummary
      init_args:
        max_depth: -1
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
    - class_path: weaver.utils.loss_logger.LossLogger
      init_args:
        save_dir: "${trainer.default_root_dir}"

model:
  weighted_loss: True
  lr: 1.25e-4
  beta_1: 0.9
  beta_2: 0.95
  weight_decay: 1e-5
  warmup_epochs: 10
  max_epochs: 150
  warmup_start_lr: 2.5e-9
  eta_min: 2.5e-9
  pretrained_path: null
  net:
    class_path: weaver.models.weaver.Weaver
    init_args:
      variables: ${data.variables}
      in_img_size: [128, 256]
      patch_size: 2
      hidden_size: 1024
      depth: 24
      num_heads: 16
      mlp_ratio: 4.0
      d_ch: 128
      channel_num_heads: 4
      use_activation_checkpointing: true
      channel_k: null
      pool_k: 4
      routed_num_experts: 9
      selected_experts: 3
      prior_scale_init: 1.0
      num_regions: 9
      region_map_path: assets/region_maps/region_labels_era5_agglomerative_patch2.npy
      region_prior_init_path: assets/region_maps/region_to_expert_prior_init_era5_agglomerative_patch2_climv2.npy
      use_mlp_gate: false
      use_weight_separation: false
      use_gating_conv: false
      noisy_gating: true

data:
  root_dir: data/h5/
  statistics_dir: assets/statistics/
  variables: [
    "2m_temperature",
    "10m_u_component_of_wind",
    "10m_v_component_of_wind",
    "mean_sea_level_pressure",
    "geopotential_50", "geopotential_100", "geopotential_150", "geopotential_200",
    "geopotential_250", "geopotential_300", "geopotential_400", "geopotential_500",
    "geopotential_600", "geopotential_700", "geopotential_850", "geopotential_925",
    "geopotential_1000",
    "u_component_of_wind_50", "u_component_of_wind_100", "u_component_of_wind_150",
    "u_component_of_wind_200", "u_component_of_wind_250", "u_component_of_wind_300",
    "u_component_of_wind_400", "u_component_of_wind_500", "u_component_of_wind_600",
    "u_component_of_wind_700", "u_component_of_wind_850", "u_component_of_wind_925",
    "u_component_of_wind_1000",
    "v_component_of_wind_50", "v_component_of_wind_100", "v_component_of_wind_150",
    "v_component_of_wind_200", "v_component_of_wind_250", "v_component_of_wind_300",
    "v_component_of_wind_400", "v_component_of_wind_500", "v_component_of_wind_600",
    "v_component_of_wind_700", "v_component_of_wind_850", "v_component_of_wind_925",
    "v_component_of_wind_1000",
    "temperature_50", "temperature_100", "temperature_150", "temperature_200",
    "temperature_250", "temperature_300", "temperature_400", "temperature_500",
    "temperature_600", "temperature_700", "temperature_850", "temperature_925",
    "temperature_1000",
    "specific_humidity_50", "specific_humidity_100", "specific_humidity_150",
    "specific_humidity_200", "specific_humidity_250", "specific_humidity_300",
    "specific_humidity_400", "specific_humidity_500", "specific_humidity_600",
    "specific_humidity_700", "specific_humidity_850", "specific_humidity_925",
    "specific_humidity_1000",
    "geopotential_at_surface", "land_sea_mask",
  ]
  list_train_intervals: [6, 12, 24]
  steps: 1
  val_lead_times: [6, 24]
  data_freq: 6
  batch_size: 2
  val_batch_size: 2
  num_workers: 8
  pin_memory: True
