[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weaver-core"
version = "0.1.0"
description = "Minimal WEAVER weather-model training, inference, and evaluation code"
readme = "README.md"
requires-python = ">=3.8"
authors = [
  {name = "Shuobo Sun"},
  {name = "Jiaqi Zheng"},
  {name = "Yerong Feng"},
  {name = "Qing Ling"},
]
keywords = ["weather forecasting", "ERA5", "mixture of experts", "transformer"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/sunshb5/Weaver"
Repository = "https://github.com/sunshb5/Weaver"

[project.scripts]
weaver-train = "train:main"
weaver-predict = "predict:main"
weaver-infer = "infer:main"
weaver-evaluate = "evaluate:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools]
py-modules = ["train", "predict", "infer", "evaluate"]

[tool.setuptools.packages.find]
include = ["weaver*"]
